name: Verify enterprise gateway
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: |
            go.sum
            modules/engine/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build pinned new-api process fixture
        run: |
          git init "$RUNNER_TEMP/new-api-fixture"
          git -C "$RUNNER_TEMP/new-api-fixture" fetch --depth=1 https://github.com/jhzhfree/new-api.git 7d06da50e22340da362b2d21c9dd8f7cb4a44d7e
          git -C "$RUNNER_TEMP/new-api-fixture" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/new-api-fixture"
          go build -race -mod=readonly -o "$RUNNER_TEMP/newapi-governance-server" ./scripts/testdata/governance_server
          echo "TEST_NEWAPI_SERVER_BINARY=$RUNNER_TEMP/newapi-governance-server" >> "$GITHUB_ENV"
      - run: bash scripts/verify.sh
        env:
          AIGW_VERIFY_WEB: '1'
  package:
    name: Verify native Linux candidate
    needs: prototype
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bash scripts/verify-release.sh
