name: Verify enterprise gateway
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: |
            go.sum
            modules/engine/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build pinned new-api process fixture
        run: |
          newapi_commit="$(python3 -c 'import json,re; v=json.load(open("deploy/newapi-compatibility.json"))["validated_commit"]; assert re.fullmatch("[0-9a-f]{40}",v); print(v)')"
          git init "$RUNNER_TEMP/new-api-fixture"
          git -C "$RUNNER_TEMP/new-api-fixture" fetch --depth=1 https://github.com/jhzhfree/new-api.git "$newapi_commit"
          git -C "$RUNNER_TEMP/new-api-fixture" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/new-api-fixture"
          go build -race -mod=readonly -o "$RUNNER_TEMP/newapi-governance-server" ./scripts/testdata/governance_server
          echo "TEST_NEWAPI_SERVER_BINARY=$RUNNER_TEMP/newapi-governance-server" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install pinned test-only Responses SDK
        run: |
          python -m venv "$RUNNER_TEMP/responses-sdk"
          "$RUNNER_TEMP/responses-sdk/bin/pip" install --require-virtualenv -r scripts/responses-sdk-requirements.txt
          echo "AIGW_SDK_PYTHON=$RUNNER_TEMP/responses-sdk/bin/python" >> "$GITHUB_ENV"
      - name: Install pinned test-only Messages SDK
        run: |
          python -m venv "$RUNNER_TEMP/messages-sdk"
          "$RUNNER_TEMP/messages-sdk/bin/pip" install --require-virtualenv -r scripts/messages-sdk-requirements.txt
          echo "AIGW_MESSAGES_SDK_PYTHON=$RUNNER_TEMP/messages-sdk/bin/python" >> "$GITHUB_ENV"
      - run: bash scripts/verify.sh
        env:
          AIGW_VERIFY_WEB: '1'
          AIGW_VERIFY_SDK: '1'
  package:
    name: Verify control-plane Linux candidate
    needs: prototype
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bash scripts/verify-release.sh
